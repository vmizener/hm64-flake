name: "Poll & Update Releases"

on:
  schedule:
    # Run every 12 hours (00:15, 12:15 UTC)
    - cron: "15 */12 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  check-upstream:
    name: "Check for New Releases"
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      updates: ${{ steps.check.outputs.updates }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Query upstream GitHub releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-release.sh --check-only

  update-and-pr:
    name: "Update ${{ matrix.update.project }} & Create Pull Request"
    needs: check-upstream
    if: needs.check-upstream.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        update: ${{ fromJson(needs.check-upstream.outputs.updates) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Update release and compute hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-release.sh "${{ matrix.update.project }}"

      - name: Run fast checks
        run: nix flake check --show-trace

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          commit-message: "chore(${{ matrix.update.project }}): update to ${{ matrix.update.version }}"
          title: "Update ${{ matrix.update.project }} to ${{ matrix.update.version }}"
          body: |
            Automated update to upstream release.
            - **Project**: `${{ matrix.update.project }}`
            - **Release name**: `${{ matrix.update.name }}`
            - **Version**: `${{ matrix.update.version }}`
          branch: "auto-update/${{ matrix.update.project }}-${{ matrix.update.version }}"
          delete-branch: true
